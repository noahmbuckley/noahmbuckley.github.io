<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found – Noah Buckley</title>
<script>
// GitHub Pages serves this page for any missing path. Old links are forwarded:
//   /private/teaching/research-guide/...     -> /teaching/research-guide/...  (public since 2026-09-11)
//   /resources/<known page>/...,
//   /private/<known page>/...                -> /internal/<known page>/... (unlisted area, moved 2026-09-15)
//   /resources/, /private/, /private/resources.html -> /resources.html  (public Resources page)
// Only the known unlisted pages are forwarded, so guessing /resources/<anything> doesn't reveal the new path.
(function () {
  var p = location.pathname;
  var DESK = "/internal";
  var KNOWN = /^\/(resources|private)\/(tutor-desk|talks|apps|viewer|sdb_report|teaching\/[^\/]+\/slides)(\/|$)/;
  var to = null;
  if (/^\/private\/teaching\/research-guide(\/|$)/.test(p)) {
    to = p.replace(/^\/private\/teaching\/research-guide/, "/teaching/research-guide");
  } else if (KNOWN.test(p)) {
    to = p.replace(/^\/(resources|private)/, DESK);
  } else if (/^\/(resources|private)(\/(index\.html)?)?$/.test(p) || p === "/private/resources.html") {
    to = "/resources.html";
  }
  if (to) location.replace(to + location.search + location.hash);
})();
</script>
<style>
  body {
    font-family: "Source Serif 4", Georgia, serif;
    background: #fbf9f6; color: #222;
    max-width: 540px; margin: 4rem auto; padding: 0 1.5rem;
    font-size: 17px; line-height: 1.6;
  }
  h1 { font-size: 1.6rem; }
  a { color: #1b5e7b; }
</style>
</head>
<body>
<h1>Page not found</h1>
<p>Sorry, there's nothing at this address. Try the <a href="/">home page</a>.</p>
</body>
</html>
