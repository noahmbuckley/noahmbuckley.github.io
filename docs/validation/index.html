<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F4E79">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Validate">
<title>Validation — Noah Buckley</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="topbar">
  <div class="topbar-left">
    <button id="btn-home" class="iconbtn" title="Task picker" aria-label="Tasks">&#x2630;</button>
    <span id="task-name">Validation</span>
  </div>
  <div class="topbar-right">
    <span id="progress-text" class="muted"></span>
    <button id="btn-menu" class="iconbtn" title="Menu" aria-label="Menu">&#x22EE;</button>
  </div>
</header>

<main id="app">

  <!-- ============== Picker view ============== -->
  <section id="view-picker" class="view">
    <h1>Validation tasks</h1>
    <p class="muted">Pick a task. Your progress is saved locally; you can switch and come back.</p>
    <div id="task-list" class="task-list"></div>
    <div class="footer-row">
      <button id="btn-refresh-tasks" class="ghost">Refresh tasks &amp; data from server</button>
    </div>
  </section>

  <!-- ============== Item view ============== -->
  <section id="view-item" class="view hidden">
    <div id="task-instructions" class="instructions"></div>
    <div id="display-card" class="card display-card"></div>
    <form id="validation-form" class="card form-card" autocomplete="off"></form>
    <nav class="navrow">
      <button id="btn-prev" class="ghost" type="button">&larr; Prev</button>
      <button id="btn-skip" class="ghost" type="button">Skip</button>
      <button id="btn-jump" class="ghost" type="button" title="Jump to row">Go to&hellip;</button>
      <button id="btn-save-next" class="primary" type="button">Save &amp; next &rarr;</button>
    </nav>
    <p id="kbd-hint" class="muted small">
      Keys: <kbd>1</kbd>/<kbd>2</kbd>/<kbd>3</kbd>/<kbd>4</kbd> verdict &middot;
      <kbd>&larr;</kbd>/<kbd>&rarr;</kbd> nav &middot;
      <kbd>Enter</kbd> save&amp;next &middot;
      <kbd>N</kbd> notes
    </p>
  </section>

  <!-- ============== Menu sheet ============== -->
  <section id="menu-sheet" class="sheet hidden" aria-hidden="true">
    <div class="sheet-content">
      <h2>Task menu</h2>
      <button id="btn-export"        class="primary block">Export answers&hellip;</button>
      <button id="btn-stats"         class="ghost block">Show stats</button>
      <button id="btn-go-picker"     class="ghost block">Switch task</button>
      <hr>
      <h3>Sync &amp; storage</h3>
      <button id="btn-sync-now"      class="ghost block">Sync now (re-pull from server)</button>
      <button id="btn-persist"       class="ghost block">Request persistent storage</button>
      <button id="btn-storage-info"  class="ghost block">Storage info</button>
      <hr>
      <h3>Danger zone</h3>
      <button id="btn-reset-task"    class="warn  block">Reset this task's answers</button>
      <button id="btn-reset-all"     class="warn  block">Wipe all local data</button>
      <button id="btn-close-menu"    class="ghost block">Close</button>
      <p id="menu-msg" class="muted small"></p>
    </div>
  </section>

  <!-- ============== Toast ============== -->
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

</main>

<script src="app.js"></script>
</body>
</html>
