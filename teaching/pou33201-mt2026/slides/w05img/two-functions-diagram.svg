<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowNavy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A5276"/>
    </marker>
    <marker id="arrowMaroon" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7B2D4B"/>
    </marker>
  </defs>

  <!-- top box: the institution -->
  <rect x="270" y="20" width="360" height="90" rx="10" fill="#A04000"/>
  <text x="450" y="58" text-anchor="middle" fill="white" font-size="26" font-weight="bold">Ruling party</text>
  <text x="450" y="90" text-anchor="middle" fill="white" font-size="26" font-weight="bold">or legislature</text>

  <!-- two arrows down -->
  <path d="M 390 112 L 240 208" stroke="#1A5276" stroke-width="4" fill="none" marker-end="url(#arrowNavy)"/>
  <path d="M 510 112 L 660 208" stroke="#7B2D4B" stroke-width="4" fill="none" marker-end="url(#arrowMaroon)"/>

  <!-- left box: co-optation -->
  <rect x="40" y="218" width="400" height="172" rx="10" fill="none" stroke="#1A5276" stroke-width="3"/>
  <text x="240" y="266" text-anchor="middle" fill="#1A5276" font-size="30" font-weight="bold">Co-optation</text>
  <text x="240" y="306" text-anchor="middle" fill="#333333" font-size="19">rivals and constituencies</text>
  <text x="240" y="332" text-anchor="middle" fill="#333333" font-size="19">brought inside, given a stake</text>
  <text x="240" y="358" text-anchor="middle" fill="#333333" font-size="19">in the system's survival</text>

  <!-- right box: power-sharing -->
  <rect x="460" y="218" width="400" height="172" rx="10" fill="none" stroke="#7B2D4B" stroke-width="3"/>
  <text x="660" y="256" text-anchor="middle" fill="#7B2D4B" font-size="27" font-weight="bold">Credible</text>
  <text x="660" y="290" text-anchor="middle" fill="#7B2D4B" font-size="27" font-weight="bold">power-sharing</text>
  <text x="660" y="326" text-anchor="middle" fill="#333333" font-size="19">the leader's promises to</text>
  <text x="660" y="352" text-anchor="middle" fill="#333333" font-size="19">elites become enforceable,</text>
  <text x="660" y="378" text-anchor="middle" fill="#333333" font-size="19">not just words</text>

  <!-- bottom labels -->
  <text x="240" y="430" text-anchor="middle" fill="#5B6770" font-size="18" font-style="italic">outsiders brought in</text>
  <text x="660" y="430" text-anchor="middle" fill="#5B6770" font-size="18" font-style="italic">insiders bound</text>
</svg>
