project:
  type: website
  output-dir: docs
  resources:
    - CNAME
    - google7674fac84ca96997.html
    - robots.txt
    - 404.html         # also forwards old /private/... links to /resources/...
    # Pages built outside this Quarto project. Each lives in a source folder here and
    # Quarto copies it into docs/ on render. Never write into docs/ alone: a full render
    # empties docs/ and rebuilds it from these folders (see internal/README.md).
    - internal/**   # unlisted pages, index at /internal/ (was resources/ until 2026-09-15)
    - teaching/**      # public: research guide, course sites
    - validation/**

website:
  title: "Noah Buckley"
  site-url: "https://noahbuckley.me"
  description: "Noah Buckley, Assistant Professor of Political Science at Trinity College Dublin. Russian politics, authoritarian regimes, public opinion."
  search: false

  # Three plain links, never collapsed into a menu. The advice pages (research guide,
  # AI, Claude Code) are reached from Teaching or the unlisted /resources/ index.
  navbar:
    collapse: false
    pinned: false
    right:
      - text: "Research"
        href: research.qmd
      - text: "Teaching"
        href: teaching.qmd
      - text: "CV"
        href: cv.qmd

  page-footer:
    center: "Noah Buckley · Trinity College Dublin · [noah.buckley@tcd.ie](mailto:noah.buckley@tcd.ie) · [Google Scholar](https://scholar.google.com/citations?user=TZ07K8wAAAAJ) · [SSRN](http://papers.ssrn.com/sol3/cf_dev/AbsByAuth.cfm?per_id=1678779)"

  open-graph: true
  twitter-card: true

format:
  html:
    theme:
      - cosmo
      - custom.scss
    css: styles.css
    toc: false
    page-layout: article
    grid:
      body-width: 700px
      margin-width: 150px
    description-meta: "Noah Buckley - Assistant Professor of Political Science at Trinity College Dublin. Research on Russian politics, authoritarian regimes, public opinion, and corruption."
    author-meta: "Noah Buckley"
    link-external-newwindow: false
